name: CI: Build & Deploy Flutter web to Firebase Hosting

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build Flutter web
      run: flutter build web --release

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Decode Firebase service account
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        echo "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > $HOME/firebase-service-account.json

    - name: Deploy to Firebase Hosting
      env:
        GOOGLE_APPLICATION_CREDENTIALS: $HOME/firebase-service-account.json
        FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
      run: |
        firebase deploy --only hosting --project "$FIREBASE_PROJECT" --non-interactive
